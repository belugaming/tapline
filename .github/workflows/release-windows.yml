name: Release (Windows)

# Runs when a Windows version tag is pushed, e.g. windows-v0.4.0. scripts/release.sh
# tags it together with the macOS release when windows/CHANGELOG.md has entries.
on:
  push:
    tags: ["windows-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        run: |
          version="${GITHUB_REF_NAME#windows-v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # File versions are numeric: 0.4.0-beta.1 -> 0.4.0
          echo "FILE_VERSION=${version%%-*}" >> "$GITHUB_ENV"

      - name: Test core
        run: dotnet test tests/Tapline.Core.Tests -c Release

      - name: Publish
        run: >
          dotnet publish src/Tapline/Tapline.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:Version="$VERSION" -p:FileVersion="$FILE_VERSION" -p:AssemblyVersion="$FILE_VERSION"
          -o artifacts/publish

      - name: Installer
        run: |
          choco install innosetup --no-progress -y
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //DAppVersion="$VERSION" //DSourceDir="..\\artifacts\\publish" //DOutputDir="..\\artifacts\\dist" installer/Tapline.iss

      # Only the installer: its uninstaller gives Equalizer APO its configuration back.
      - name: Checksums
        run: (cd artifacts/dist && sha256sum Tapline-* | tee SHA256SUMS.txt)

      - name: Release notes
        run: |
          {
            awk -v v="$VERSION" '$0 ~ "^## " v {p=1; next} /^## / {p=0} p' CHANGELOG.md
            echo
            echo "### Install"
            echo "Requires 64-bit Windows 10 or 11 and [Equalizer APO](https://sourceforge.net/projects/equalizerapo/) (free). Install Equalizer APO first and tick your output devices in its Configurator, restart, then run **Tapline-$VERSION-win-x64-setup.exe**. The app is not code-signed yet, so SmartScreen may warn: click **More info → Run anyway**."
            echo
            echo "需要 64 位 Windows 10 或 11，以及免费的 [Equalizer APO](https://sourceforge.net/projects/equalizerapo/)。先安装 Equalizer APO，在它的 Configurator 中勾选输出设备并重启，然后运行 **Tapline-$VERSION-win-x64-setup.exe**。程序还没有代码签名，SmartScreen 可能会拦截：点“更多信息 → 仍要运行”。"
            echo
            echo "Please report problems in [Issues](https://github.com/belugaming/tapline/issues)."
          } > artifacts/notes.md
          cat artifacts/notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          files=(artifacts/dist/Tapline-* artifacts/dist/SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file artifacts/notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "Tapline for Windows $VERSION" --notes-file artifacts/notes.md --latest=false $prerelease
          fi
