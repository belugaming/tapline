name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: "26.6"
          - runner: xcode-27
            xcode: "27.0"
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test DSP core
        working-directory: Packages/TaplineCore
        run: swift test

      - name: Build app
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project Tapline.xcodeproj -scheme Tapline -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY=- -quiet build
          echo "Built $(scripts/version.sh) with Xcode ${{ matrix.xcode }}"

      # A test build of the pull request, built like a release (Xcode 26.6), to download
      # from the run's Summary page. Zipped with ditto first: artifacts lose the
      # executable bit and the bundle's symlinks.
      - name: Package test build
        if: github.event_name == 'pull_request' && matrix.xcode == '26.6'
        run: ditto -c -k --keepParent build/Build/Products/Release/Tapline.app "Tapline-pr${{ github.event.number }}.zip"

      - name: Upload test build
        if: github.event_name == 'pull_request' && matrix.xcode == '26.6'
        uses: actions/upload-artifact@v4
        with:
          name: Tapline-pr${{ github.event.number }}
          path: Tapline-pr${{ github.event.number }}.zip
          retention-days: 14
