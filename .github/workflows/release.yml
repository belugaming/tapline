name: Release

# Runs when a version tag is pushed (scripts/release.sh creates one).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      XCODE: "26.6"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve version
        run: |
          version="${GITHUB_REF_NAME#v}"
          project="$(scripts/version.sh)"
          if [ "$version" != "$project" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $project in project.yml. Use scripts/release.sh."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Test DSP core
        working-directory: Packages/TaplineCore
        run: swift test

      - name: Build
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project Tapline.xcodeproj -scheme Tapline -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_IDENTITY=- -quiet build
          app=build/Build/Products/Release/Tapline.app
          lipo -archs "$app/Contents/MacOS/Tapline"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" "$app/Contents/Info.plist"

      - name: Package
        run: |
          mkdir -p dist
          name="Tapline-$VERSION-arm64.dmg"
          # The disk image holds the app and an Applications shortcut to drag it onto.
          stage="$(mktemp -d)/Tapline"
          mkdir -p "$stage"
          ditto build/Build/Products/Release/Tapline.app "$stage/Tapline.app"
          ln -s /Applications "$stage/Applications"
          # hdiutil sometimes fails with "Resource busy" on hosted runners; retry.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname "Tapline $VERSION" -srcfolder "$stage" \
              -fs HFS+ -format UDZO -ov "dist/$name" && break
            [ "$attempt" -lt 5 ] || exit 1
            sleep 5
          done
          hdiutil verify "dist/$name"
          (cd dist && shasum -a 256 "$name" | tee SHA256SUMS.txt)
          echo "DMG=dist/$name" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          {
            scripts/changelog-section.sh "$VERSION"
            echo
            echo "### Install"
            echo "Requires macOS 26 or later on Apple Silicon. Open the .dmg and drag **Tapline.app** onto the Applications shortcut. The app is ad-hoc signed and not notarized: open it once, then click **Open Anyway** in **System Settings → Privacy & Security**."
            echo
            echo "需要 macOS 26 及以上、Apple Silicon。打开 .dmg，把 Tapline.app 拖到旁边的“应用程序”图标上。应用只有临时签名、未经公证：先打开一次，再到“系统设置 → 隐私与安全性”点“仍要打开”。"
            echo
            echo "Build $BUILD · Xcode $XCODE · SHA-256 \`$(cut -d' ' -f1 dist/SHA256SUMS.txt)\`"
          } > dist/notes.md
          cat dist/notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DMG" dist/SHA256SUMS.txt --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file dist/notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$DMG" dist/SHA256SUMS.txt \
              --title "Tapline $VERSION" --notes-file dist/notes.md $prerelease
          fi
